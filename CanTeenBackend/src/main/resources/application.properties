spring.application.name=CanTeenBackend

server.port=8083
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canteen_database?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.tmn-code=${VNPAY_TMN_CODE:2QXUY4PK}
vnpay.hash-secret=${VNPAY_HASH_SECRET:RAHQFQVFNYWSTNTXMPURCMOWXZAWNAGX}
vnpay.return-url=${VNPAY_RETURN_URL:https://api.huyloi.uk/api/customer/vnpay-callback}
canteen.frontend-url=${FRONTEND_URL:https://huyloi.uk}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:gmail-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:cloudinary_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:cloudinary_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:cloudinary_api_secret}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB